name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install uv
          uv sync --frozen --extra dev

      - name: Ruff lint
        run: uv run --frozen --extra dev ruff check nexus/ company_alembic/

      - name: Ruff format check
        run: uv run --frozen --extra dev ruff format --check nexus/ company_alembic/

      - name: Mypy type check
        run: uv run --frozen --extra dev mypy nexus/ --ignore-missing-imports

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install uv
          uv sync --frozen --extra dev

      - name: Run unit tests
        run: uv run --frozen --extra dev pytest nexus/tests/unit/ -v --tb=short

  test-company-governance:
    name: Company PostgreSQL - ${{ matrix.suite }}
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: journal
            database: nexus_company_test_ci
            tests: test_company_journal.py
          - suite: directory
            database: nexus_company_test_directory
            tests: test_company_directory.py
          - suite: registered-authority
            database: nexus_company_test_governance
            tests: test_company_registered_authorization.py
          - suite: owner-controls
            database: nexus_company_test_governance
            tests: test_company_controls.py
          - suite: standing-authority
            database: nexus_company_test_standing
            tests: test_company_standing_authority.py
          - suite: standing-journal
            database: nexus_company_test_standing_journal
            tests: test_company_standing_journal.py
          - suite: execution
            database: nexus_company_test_execution
            tests: test_company_execution_store.py test_company_execution_recovery.py test_company_dispatched_recovery.py test_company_terminal_receipt.py test_company_effect_budget.py
          - suite: transactional-enqueue
            database: nexus_company_test_enqueue
            tests: test_company_atomic_enqueue.py test_company_reservation_day.py
          - suite: clean-profile
            database: nexus_company_test_release
            tests: test_company_profile_migrations.py
          - suite: rls-context
            database: nexus_company_test_rls_scope
            tests: test_company_rls_context.py
          - suite: company-api
            database: nexus_company_test_api
            tests: test_company_api.py
          - suite: offline-worker
            database: nexus_company_test_worker
            tests: test_company_worker.py
          - suite: lease-data-migration
            database: nexus_company_test_lease_migration
            tests: test_company_lease_migration.py
          - suite: owner-reconciliation
            database: nexus_company_test_owner_reconcile
            tests: test_company_owner_reconciliation.py
          - suite: model-request-gate
            database: nexus_company_test_model_gate
            tests: test_company_model_authorizer.py
          - suite: owner-billing
            database: nexus_company_test_owner_billing
            tests: test_company_owner_billing.py
          - suite: governed-model-client
            database: nexus_company_test_model_client
            tests: test_company_model_client.py test_company_model_client_cleanup.py test_company_model_client_interrupt.py
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ${{ matrix.database }}
          # Disposable isolated CI service; no production credential is used.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      COMPANY_TEST_DATABASE_URL: postgresql+asyncpg://postgres@localhost:5432/${{ matrix.database }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: |
          pip install uv
          uv sync --frozen --extra dev
      - name: Create restricted disposable application role
        run: |
          uv run --frozen --extra dev python - <<'PY'
          import asyncio
          import asyncpg
          from nexus.settings import settings

          async def prepare() -> None:
              url = settings.company_test_database_url.replace("postgresql+asyncpg://", "postgresql://", 1)
              connection = await asyncpg.connect(url)
              try:
                  await connection.execute("CREATE ROLE nexus_company_app LOGIN NOSUPERUSER")
                  await connection.execute("GRANT USAGE ON SCHEMA public TO nexus_company_app")
              finally:
                  await connection.close()

          asyncio.run(prepare())
          PY
      - name: Run restricted PostgreSQL acceptance
        run: |
          set -- ${{ matrix.tests }}
          for test_file do
            uv run --frozen --extra dev pytest "nexus/tests/integration/$test_file" -v --tb=short
          done

  test-behavior:
    name: Behavior Tests
    runs-on: ubuntu-latest
    needs: lint
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install uv
          uv sync --frozen --extra dev

      - name: Run behavior tests
        run: uv run --frozen --extra dev pytest nexus/tests/behavior/ -v --tb=short

  test-chaos:
    name: Chaos Tests
    runs-on: ubuntu-latest
    needs: lint
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install uv
          uv sync --frozen --extra dev

      - name: Run chaos tests
        run: uv run --frozen --extra dev pytest nexus/tests/chaos/ -v --tb=short

  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install uv
          uv sync --frozen --extra dev

      - name: Run integration tests
        run: uv run --frozen --extra dev pytest nexus/tests/integration/ -v --tb=short

  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Build check
        run: npm run build

  # ── Security Scanning ─────────────────────────────────────────────────────

  security-backend:
    name: Backend Security Scan
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]" pip-audit bandit

      - name: Dependency vulnerability scan
        run: pip-audit --strict --desc

      - name: SAST scan (bandit)
        run: bandit -r nexus/ -c pyproject.toml --severity-level medium -f json -o bandit-report.json || true

      - name: Upload bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: backend/bandit-report.json

  security-frontend:
    name: Frontend Security Scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Dependency vulnerability scan
        run: npm audit --audit-level=moderate || true

  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Docker Build ──────────────────────────────────────────────────────────

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [test-unit, test-behavior, security-backend]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: backend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:latest
            ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/frontend:latest
            ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan backend image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
