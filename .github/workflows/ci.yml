name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install uv
          uv sync --frozen --extra dev

      - name: Ruff lint
        run: uv run --frozen --extra dev ruff check nexus/ company_alembic/

      - name: Ruff format check
        run: uv run --frozen --extra dev ruff format --check nexus/ company_alembic/

      - name: Mypy type check
        run: uv run --frozen --extra dev mypy nexus/ --ignore-missing-imports

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install uv
          uv sync --frozen --extra dev

      - name: Run unit tests
        run: uv run --frozen --extra dev pytest nexus/tests/unit/ -v --tb=short

  test-company-governance:
    name: Company PostgreSQL - ${{ matrix.suite }}
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: journal
            database: nexus_company_test_ci
            tests: test_company_journal.py
          - suite: directory
            database: nexus_company_test_directory
            tests: test_company_directory.py test_company_atomic_registration.py
          - suite: registered-authority
            database: nexus_company_test_governance
            tests: test_company_registered_authorization.py
          - suite: owner-controls
            database: nexus_company_test_governance
            tests: test_company_controls.py
          - suite: standing-authority
            database: nexus_company_test_standing
            tests: test_company_standing_authority.py
          - suite: standing-journal
            database: nexus_company_test_standing_journal
            tests: test_company_standing_journal.py
          - suite: execution
            database: nexus_company_test_execution
            tests: test_company_execution_store.py test_company_execution_recovery.py test_company_dispatched_recovery.py test_company_terminal_receipt.py test_company_effect_budget.py
          - suite: transactional-enqueue
            database: nexus_company_test_enqueue
            tests: test_company_atomic_enqueue.py test_company_reservation_day.py
          - suite: clean-profile
            database: nexus_company_test_release
            tests: test_company_profile_migrations.py
          - suite: rls-context
            database: nexus_company_test_rls_scope
            tests: test_company_rls_context.py
          - suite: company-api
            database: nexus_company_test_api
            tests: test_company_api.py
          - suite: offline-worker
            database: nexus_company_test_worker
            tests: test_company_worker.py
          - suite: lease-data-migration
            database: nexus_company_test_lease_migration
            tests: test_company_lease_migration.py
          - suite: owner-reconciliation
            database: nexus_company_test_owner_reconcile
            tests: test_company_owner_reconciliation.py
          - suite: model-request-gate
            database: nexus_company_test_model_gate
            tests: test_company_model_authorizer.py
          - suite: owner-billing
            database: nexus_company_test_owner_billing
            tests: test_company_owner_billing.py
          - suite: governed-model-client
            database: nexus_company_test_model_client
            tests: test_company_model_client.py test_company_model_client_cleanup.py test_company_model_client_interrupt.py
          - suite: brain-access-and-schema-guards
            database: nexus_company_test_brain_access
            tests: test_company_brain_access.py test_company_brain_guards.py test_company_management_transactions.py
          - suite: brain-ingestion
            database: nexus_company_test_brain_ingest
            tests: test_company_brain_ingestion.py test_company_brain_events.py test_company_brain_derivations.py test_company_brain_parse_history.py
          - suite: brain-retrieval-context
            database: nexus_company_test_brain_retrieval
            tests: test_company_brain_retrieval.py test_company_brain_artifact_revalidation.py
          - suite: brain-api
            database: nexus_company_test_brain_api
            tests: test_company_brain_api.py test_company_brain_api_graph.py test_company_brain_fixture_seed.py test_company_brain_case_observer.py
          - suite: brain-model-context-gate
            database: nexus_company_test_brain_model_gate
            tests: test_company_brain_model_gate.py
          - suite: brain-company-app
            database: nexus_company_test_brain_app
            tests: test_company_brain_app.py
          - suite: brain-claim-ontology-publication
            database: nexus_company_test_brain_publication
            tests: test_company_brain_claim_publication.py test_company_brain_claim_links.py test_company_brain_ontology_publication.py test_company_brain_publication_access.py test_company_brain_publication_races.py test_company_brain_candidate_verification.py
          - suite: management-schema-guards
            database: nexus_company_test_management_guards
            tests: test_company_management_guards.py
          - suite: management-owner-controls-goals
            database: nexus_company_test_management_controls
            tests: test_company_management_controls.py test_company_management_goals.py test_company_management_goal_expiry.py
          - suite: management-plan-registration
            database: nexus_company_test_management_plans
            tests: test_company_management_plans.py
          - suite: management-independent-acceptance
            database: nexus_company_test_management_acceptance
            tests: test_company_management_acceptance.py test_company_management_acceptance_denials.py test_company_management_acceptance_expiry.py test_company_management_acceptance_lifecycle.py test_company_management_acceptance_final_grants.py test_company_management_acceptance_replay_expiry.py
          - suite: management-model-gateway
            database: nexus_company_test_management_model
            tests: test_company_managed_model.py test_company_managed_model_price_expiry.py
          - suite: management-owner-api
            database: nexus_company_test_management_api
            tests: test_company_management_api.py
          - suite: management-owner-cancellation
            database: nexus_company_test_management_cancellation
            tests: test_company_management_cancellation.py test_company_cancellation_boundaries.py test_company_cancellation_schema.py test_company_cancellation_compatibility.py
          - suite: management-owner-control-api
            database: nexus_company_test_management_control_api
            tests: test_company_management_control_api.py test_company_management_control_facts.py
          - suite: management-metric-schema
            database: nexus_company_test_metric_schema
            tests: test_company_metric_schema.py
          - suite: management-native-metrics
            database: nexus_company_test_management_metrics
            tests: test_company_metrics.py test_company_metric_proofs.py test_company_metric_expiry.py test_company_metric_recipe.py test_company_metric_queries.py
          - suite: management-metric-api
            database: nexus_company_test_metrics_api
            tests: test_company_metric_api.py test_company_metric_api_facts.py
          - suite: brain-generated-input-provenance
            database: nexus_company_test_management_artifacts
            tests: test_company_artifact_input_provenance.py test_company_artifact_targets.py
          - suite: management-native-reports
            database: nexus_company_test_management_reports
            tests: test_company_operating_reports.py test_company_operating_report_author.py test_company_operating_report_denials.py test_company_operating_report_expiry.py test_company_operating_report_history.py test_company_operating_report_invoices.py test_company_operating_report_no_ttl.py test_company_operating_report_artifact_roots.py test_company_artifact_ancestor_sources.py
          - suite: management-owner-views-commitments
            database: nexus_company_test_management_views
            tests: test_company_management_owner_views.py test_company_management_owner_view_finance.py test_company_management_owner_view_lifecycle.py test_company_management_owner_view_sources.py test_company_management_commitments.py
          - suite: management-owner-read-api
            database: nexus_company_test_management_views_api
            tests: test_company_management_read_api.py test_company_management_action_review_api.py test_company_management_generated_review_api.py
          - suite: management-event-scheduler
            database: nexus_company_test_management_scheduler
            tests: test_company_management_scheduler.py test_company_management_scheduler_boundaries.py test_company_management_scheduler_acceptance.py test_company_management_scheduler_admission.py test_company_management_scheduler_process.py test_company_scheduler_cancellation.py
          - suite: management-generated-artifacts
            database: nexus_company_test_generated_artifacts
            tests: test_company_generated_artifacts.py test_company_generated_artifact_denials.py test_company_generated_artifact_lifecycle.py test_company_generated_artifact_profile_time.py test_company_generated_artifact_production.py
          - suite: management-native-producer
            database: nexus_company_test_native_reports
            tests: test_company_native_report_producer.py
          - suite: management-native-profile
            database: nexus_company_test_native_profile
            tests: test_company_native_profile.py test_company_native_profile_verifier.py test_company_native_profile_boundary.py test_company_native_profile_lease.py test_company_native_profile_denials.py
          - suite: management-native-operating-loop
            database: nexus_company_test_operating_loop
            tests: test_company_operating_loop.py test_company_operating_loop_denials.py test_company_operating_loop_expiry.py test_company_operating_loop_unknown.py test_company_operating_loop_capacity.py test_company_registered_target_read.py
          - suite: native-builder-node-runtime
            database: nexus_company_test_builder_node_hosts
            tests: test_native_builder_node.py
          - suite: management-native-report-api
            database: nexus_company_test_native_report_api
            tests: test_company_native_report_api.py test_company_native_report_api_owner.py
          - suite: owner-notification-schema
            database: nexus_company_test_notification_schema
            tests: test_company_notification_schema.py test_company_notification_intent_schema.py test_company_notification_observation_schema.py
          - suite: native-event-schema
            database: nexus_company_test_native_schema
            tests: test_company_native_event_schema.py test_company_native_event_security.py test_company_native_event_downgrade.py
          - suite: native-event-old-profile-compatibility
            database: nexus_company_test_native_events
            tests: test_company_native_event_compatibility.py
          - suite: native-event-facts
            database: nexus_company_test_native_events
            tests: test_company_native_fact_events.py test_company_native_fact_privacy.py test_company_native_fact_outcomes.py test_company_native_fact_digest.py test_company_native_fact_time.py test_company_native_fact_company_cap.py
          - suite: native-receipt-event-transaction
            database: nexus_company_test_receipt_events
            tests: test_company_receipt_event_atomic.py test_company_receipt_event_denials.py test_company_receipt_event_recovery.py test_company_receipt_event_composition.py test_company_effect_preflight.py
          - suite: owner-notification-native-drafts
            database: nexus_company_test_notifications
            tests: test_company_notification_drafts.py test_company_notification_privacy.py
          - suite: owner-notification-dispatch
            database: nexus_company_test_notifications
            tests: test_company_notification_dispatch.py test_company_notification_delivery.py test_company_notification_intent_expiry.py test_company_notification_action_denials.py test_company_notification_status_privacy.py test_company_notification_daily_cap.py test_company_notification_approval_expiry.py test_company_notification_reconciliation_expiry.py test_company_notification_precall.py
          - suite: owner-notification-managed-sender
            database: nexus_company_test_notifications
            tests: test_company_notification_managed.py test_company_notification_managed_denials.py test_company_notification_managed_plan_splice.py test_company_notification_managed_time.py
          - suite: current-model-observation-expiry
            database: nexus_company_test_notification_review
            tests: test_company_model_observation_expiry.py
          - suite: management-native-workflow
            database: nexus_company_test_native_workflow
            tests: test_company_native_report_worker.py test_company_acceptance_reconciliation.py test_company_native_report_process.py
          - suite: disposable-session-service
            database: nexus_company_test_owner_uat
            tests: test_company_pilot_session.py
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ${{ matrix.database }}
          # Disposable isolated CI service; no production credential is used.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      COMPANY_TEST_DATABASE_URL: postgresql+asyncpg://postgres@localhost:5432/${{ matrix.database }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: |
          pip install uv
          uv sync --frozen --extra dev
      - name: Create restricted disposable application role
        run: |
          uv run --frozen --extra dev python - <<'PY'
          import asyncio
          import asyncpg
          from nexus.settings import settings

          async def prepare() -> None:
              url = settings.company_test_database_url.replace("postgresql+asyncpg://", "postgresql://", 1)
              connection = await asyncpg.connect(url)
              try:
                  await connection.execute("CREATE ROLE nexus_company_app LOGIN NOSUPERUSER")
                  await connection.execute("GRANT USAGE ON SCHEMA public TO nexus_company_app")
              finally:
                  await connection.close()

          asyncio.run(prepare())
          PY
      - name: Run restricted PostgreSQL acceptance
        run: |
          set -- ${{ matrix.tests }}
          for test_file do
            uv run --frozen --extra dev pytest "nexus/tests/integration/$test_file" -v --tb=short
          done

  test-behavior:
    name: Behavior Tests
    runs-on: ubuntu-latest
    needs: lint
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install uv
          uv sync --frozen --extra dev

      - name: Run behavior tests
        run: uv run --frozen --extra dev pytest nexus/tests/behavior/ -v --tb=short

  test-chaos:
    name: Chaos Tests
    runs-on: ubuntu-latest
    needs: lint
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install uv
          uv sync --frozen --extra dev

      - name: Run chaos tests
        run: uv run --frozen --extra dev pytest nexus/tests/chaos/ -v --tb=short

  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install uv
          uv sync --frozen --extra dev

      - name: Run integration tests
        run: uv run --frozen --extra dev pytest nexus/tests/integration/ -v --tb=short

  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Build check
        run: npm run build

      - name: Company session identity race checks
        run: node scripts/test-company-session.mjs

      - name: Company report request and bounded input checks
        run: |
          node scripts/test-company-reports.mjs
          node scripts/test-company-report-inputs.mjs

  # ── Security Scanning ─────────────────────────────────────────────────────

  security-backend:
    name: Backend Security Scan
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]" pip-audit bandit

      - name: Dependency vulnerability scan
        run: pip-audit --strict --desc

      - name: SAST scan (bandit)
        run: bandit -r nexus/ -c pyproject.toml --severity-level medium -f json -o bandit-report.json || true

      - name: Upload bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: backend/bandit-report.json

  security-frontend:
    name: Frontend Security Scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Dependency vulnerability scan
        run: npm audit --audit-level=moderate || true

  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Docker Build ──────────────────────────────────────────────────────────

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [test-unit, test-behavior, security-backend]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: backend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:latest
            ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/frontend:latest
            ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan backend image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
