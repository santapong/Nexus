[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nexus"
version = "0.1.0"
description = "NEXUS - Agentic AI Company as a Service"
requires-python = ">=3.12"
dependencies = [
    # API Framework
    "litestar[standard]==2.24.0",
    # ORM + Database
    "advanced-alchemy==0.34.0",
    "sqlalchemy==2.0.51",
    "asyncpg>=0.30.0,<1.0",
    "alembic>=1.14.0,<2.0",
    "pgvector>=0.3.6,<1.0",
    # AI Framework
    "pydantic-ai-slim[anthropic,openai,google,groq,mistral,dbos]==2.54.0",
    "pydantic-evals==2.54.0",
    "dbos==3.2.0",
    "anthropic>=1.9.0,<2.0",
    # Validation
    "pydantic==2.13.4",
    "pydantic-settings>=2.7.0,<3.0",
    # Local provider output/tool schema validation; remote reference loading is disabled.
    "jsonschema==4.26.0",
    # Authenticated operator backup envelope, already pinned transitively in the runtime.
    "cryptography==49.0.0",
    # Kafka
    "aiokafka>=0.12.0,<1.0",
    # Redis
    "redis[hiredis]>=5.2.0,<6.0",
    # Task Queue
    "taskiq>=0.11.0,<1.0",
    "taskiq-aio-kafka>=0.3.0,<1.0",
    "taskiq-redis>=1.0.0,<2.0",
    # Logging
    "structlog>=24.4.0,<25.0",
    # HTTP client (for A2A outbound, embeddings)
    "httpx>=0.28.0,<1.0",
    # JWT authentication
    "PyJWT>=2.9.0,<3.0",
    # Scheduling
    "croniter>=3.0.0,<4.0",
    # Document ingestion — Co assistant MVP-1 (ADR-090)
    "pypdf>=6.13.3,<7.0",
    "python-docx>=1.1.2,<2.0",
    "openpyxl>=3.1.5,<4.0",
    "pandas>=2.2.0,<3.0",
    "pyarrow>=23.0.1,<24.0",
    # HTML presentation sanitization — Co assistant MVP-1 (ADR-091)
    "nh3>=0.2.18,<1.0",
    # Utilities
    "uvicorn[standard]>=0.34.0,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10.0",
    "pytest-asyncio>=1.3.0,<2.0",
    "pytest-cov>=6.0.0,<8.0",
    "ruff>=0.9.0,<1.0",
    "mypy>=1.14.0,<2.0",
    "types-croniter>=3.0.0,<7.0",
    "types-jsonschema>=4.23.0,<5.0",
    "httpx>=0.28.0,<1.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "A",   # flake8-builtins
    "C4",  # flake8-comprehensions
    "T20", # flake8-print (bans print())
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]

[tool.ruff.lint.per-file-ignores]
"nexus/db/seed.py" = ["E501"]  # Seed data has long string literals
# Historical legacy findings are checked by scripts/check_legacy_ruff_baseline.py.
# Run that guard alongside `ruff check .`; it verifies published revisions and
# the exact unsuppressed diagnostics, including their complete source spans.
"alembic/env.py" = ["F401", "I001"]
"alembic/versions/001_initial_schema.py" = ["I001", "UP007", "UP035"]
"alembic/versions/002_dead_letters_and_a2a_tokens.py" = ["E501", "I001", "UP007", "UP035"]
"alembic/versions/003_eval_results.py" = ["E501", "I001", "UP007", "UP035"]
"alembic/versions/004_phase4_multi_tenant.py" = ["E501", "I001", "UP007", "UP035"]
"alembic/versions/005_performance_indexes.py" = ["UP007", "UP035"]
"alembic/versions/007_phase5_track_b_c.py" = ["E501", "I001"]
"alembic/versions/008_phase5_remaining.py" = ["E501", "I001", "UP007", "UP035"]
"alembic/versions/009_security_and_federation.py" = ["I001", "UP007", "UP035"]
"alembic/versions/010_conference_room_messaging.py" = ["I001", "UP007", "UP035"]
"alembic/versions/011_workspace_storage.py" = ["I001", "UP007", "UP035"]
"alembic/versions/016_attachments.py" = ["I001", "UP007", "UP035"]

[tool.ruff.lint.isort]
known-first-party = ["nexus"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_configs = true
# Litestar Controller/decorators are typed as Any in stubs — suppress false positives
disallow_subclassing_any = false
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = [
    "aiokafka.*",
    "taskiq.*",
    "taskiq_aio_kafka.*",
    "taskiq_redis.*",
    "advanced_alchemy.*",
    "pgvector.*",
    "pandas.*",
    "openpyxl.*",
    "docx.*",
    "pypdf.*",
    "croniter.*",
]
ignore_missing_imports = true

# These legacy integrations are optional and absent from the locked company
# runtime. When unavailable, their SDK APIs are Any and remain unqualified;
# do not suppress missing imports for unrelated modules.
[[tool.mypy.overrides]]
module = [
    "opentelemetry.exporter.otlp.proto.http.trace_exporter",
    "opentelemetry.sdk.resources",
    "opentelemetry.sdk.trace",
    "opentelemetry.sdk.trace.export",
    "langfuse",
    "stripe",
    "temporalio.client",
    "temporalio.worker",
    "e2b_code_interpreter",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["nexus/tests"]
filterwarnings = [
    "error",
    "default::DeprecationWarning",
]
