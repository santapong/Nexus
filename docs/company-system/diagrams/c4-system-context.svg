<text x="578" y="376" class="body" fill="#c1d4d3" text-anchor="start">Evidence → supervised decisions → work</text>
<text x="578" y="398" class="body" fill="#c1d4d3" text-anchor="start">Unknown outcomes remain visible.</text>
<rect x="80" y="570" width="320" height="130" rx="15" class="external" fill="#243044" stroke="#8093a6" stroke-width="2"/>
