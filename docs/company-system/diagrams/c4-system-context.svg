<text x="98" y="654" class="body" fill="#c1d4d3" text-anchor="start">Repositories and documents</text>
<text x="98" y="676" class="body" fill="#c1d4d3" text-anchor="start">admitted with access controls.</text>
<rect x="1200" y="280" width="320" height="130" rx="15" class="external" fill="#243044" stroke="#8093a6" stroke-width="2" stroke-dasharray="8 6"/>
