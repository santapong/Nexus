<text x="1218" y="364" class="body" fill="#c1d4d3" text-anchor="start">Registered adapters; live</text>
<text x="1218" y="386" class="body" fill="#c1d4d3" text-anchor="start">qualification remains open.</text>
<rect x="1200" y="570" width="320" height="130" rx="15" class="external" fill="#243044" stroke="#8093a6" stroke-width="2" stroke-dasharray="8 6"/>
<text x="1218" y="597" class="tag" fill="#79d9c6" text-anchor="start">EXTERNAL</text>
