<text x="60" y="105" class="heading" fill="#e9f4f3" text-anchor="start">01  System context</text>
<text x="60" y="138" class="subtitle" fill="#b5cbc9" text-anchor="start">Who uses Nexus and which external systems it is intended to reach.</text>
